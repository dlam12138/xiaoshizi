services:
  upc-eval:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_CACHE_API_ENABLED: ${VITE_CACHE_API_ENABLED:-false}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: upc_teacher_eval
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
