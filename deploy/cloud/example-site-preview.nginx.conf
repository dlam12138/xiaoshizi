# UPC 受限预发布站点：example.org + www 跳转
# example-site 已停用；旧配置完整备份于 /root/backups/example-site-predeploy-20261025T0111Z。
# 旧 example-site 数据保留在 /var/lib/example-site 与 /opt/example-site，不删除。
limit_req_zone $binary_remote_addr zone=upc_preview:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name example.org www.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://example.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.org;

    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://example.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.org;

    ssl_certificate /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/upc/current;
    index index.html;

    # 整站访问门：预发布阶段只允许持凭据者访问。
    auth_basic "UPC Preview";
    auth_basic_user_file /etc/nginx/upc-preview.htpasswd;

    client_max_body_size 1m;
    limit_req zone=upc_preview burst=40 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/upc-preview.access.log;
    error_log /var/log/nginx/upc-preview.error.log;
}
