# UPC 预发布站 Nginx 配置（upc.example.org）
# 只新增本 server block，不修改 example.org / www 的现有站点。
# 安装：复制到 /etc/nginx/sites-available/upc-preview 后 symlink 到 sites-enabled。

server {
    listen 80;
    listen [::]:80;
    server_name upc.example.org;

    root /var/www/upc/current;
    index index.html;

    # 可选整站门：启用前先创建 htpasswd（见 deploy/cloud/README.md）。
    # auth_basic "UPC Preview";
    # auth_basic_user_file /etc/nginx/upc-preview.htpasswd;

    # 可选 IP 白名单：与 auth_basic 二选一或叠加。
    # allow 203.0.113.10;
    # deny all;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/upc-preview.access.log;
    error_log /var/log/nginx/upc-preview.error.log;
}

# certbot 会为上面的 server 追加 443 server block。不要手工复用 example.org
# 的证书或 server_name。
