# Local Supabase services run inside Ubuntu WSL with CLI v2.121.0.
# Experimental native runtime: https://supabase.com/docs/guides/local-development/docker-and-native-runtimes
project_id = "upc-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = false

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

# The SQL hook allows exact student addresses and Gmail only when a private
# address-specific administrator invite exists. Enabling the hook in this file
# does not prove Auth called it; the local acceptance test uses the public key
# against the real Auth endpoint.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/before_user_created_hook"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100
token_verifications = 100

[analytics]
enabled = false

[edge_runtime]
enabled = false

[experimental]
stack = true
