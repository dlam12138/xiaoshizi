name: Sync notices

# 每小时（UTC 第 17 分钟）增量抓取一次教务通知；也可在 Actions 页面手动运行，勾选 full 做全量抓取。
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '全量抓取（首次运行时勾选）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-notices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/notices/requirements.txt
      - run: pip install -r scripts/notices/requirements.txt
      - name: Run parser tests
        run: python -m unittest discover -s scripts/notices/tests
      - name: Fetch and store notices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRAWLER_EMAIL: ${{ secrets.CRAWLER_EMAIL }}
          CRAWLER_PASSWORD: ${{ secrets.CRAWLER_PASSWORD }}
          FULL: ${{ github.event.inputs.full == 'true' && '--full' || '' }}
        run: python scripts/notices/fetch_notices.py $FULL
